name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build collector (win-x64 single file)
        run: dotnet publish collector -c Release -o publish

      - name: Write version file
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "dev-$(Get-Date -Format yyyyMMddHHmm)" }
          Set-Content -Path publish/version.txt -Value $tag

      - name: Zip + checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath collector-win-x64.zip
          $h = (Get-FileHash collector-win-x64.zip -Algorithm SHA256).Hash
          "$h  collector-win-x64.zip" | Out-File -Encoding ascii collector-win-x64.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collector-win-x64
          path: |
            collector-win-x64.zip
            collector-win-x64.zip.sha256
            publish/version.txt

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: collector-win-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            collector-win-x64.zip
            collector-win-x64.zip.sha256
          body: "Collector release ${{ github.ref_name }} — run update.bat on the CNC to pick this up."