name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build collector (win-x64 + win-x86 single file)
        run: |
          dotnet publish collector -c Release -r win-x64 -o publish/win-x64
          dotnet publish collector -c Release -r win-x86 -o publish/win-x86

      - name: Write version file
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "dev-$(Get-Date -Format yyyyMMddHHmm)" }
          foreach ($rid in @("win-x64", "win-x86")) {
            Set-Content -Path "publish/$rid/version.txt" -Value $tag
          }

      - name: Zip + checksum
        shell: pwsh
        run: |
          foreach ($rid in @("win-x64", "win-x86")) {
            $zip = "collector-$rid.zip"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath $zip
            $h = (Get-FileHash $zip -Algorithm SHA256).Hash
            "$h  $zip" | Out-File -Encoding ascii "$zip.sha256"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collector-artifacts
          path: |
            collector-win-x64.zip
            collector-win-x64.zip.sha256
            collector-win-x86.zip
            collector-win-x86.zip.sha256
            publish/win-x64/version.txt
            publish/win-x86/version.txt

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: collector-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            collector-win-x64.zip
            collector-win-x64.zip.sha256
            collector-win-x86.zip
            collector-win-x86.zip.sha256
          body: "Collector release ${{ github.ref_name }} — run update.bat on the CNC to pick this up."